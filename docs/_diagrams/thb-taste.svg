<svg xmlns="http://www.w3.org/2000/svg" text-rendering="geometricPrecision" viewBox="0 0 680 280" style="max-width:100%;display:block;margin:0 auto;color:var(--text)" font-family="Geist, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="tst-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="currentColor" stroke-width="1.5"/></marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <!-- left: team -->
    <rect x="20" y="40" width="300" height="200" rx="14" fill="#ffd8a8" fill-opacity="0.2"/>
    <rect x="45" y="70" width="70" height="90" rx="6"/>
    <rect x="135" y="70" width="70" height="90" rx="6"/>
    <rect x="225" y="70" width="70" height="90" rx="6" fill="#ffd8a8" fill-opacity="0.4"/>
    <line x1="55" y1="90" x2="105" y2="90" stroke-width="1.2"/><line x1="55" y1="105" x2="95" y2="105" stroke-width="1.2"/><line x1="55" y1="120" x2="100" y2="120" stroke-width="1.2"/><line x1="55" y1="135" x2="90" y2="135" stroke-width="1.2"/>
    <line x1="145" y1="90" x2="195" y2="90" stroke-width="1.2"/><line x1="145" y1="105" x2="185" y2="105" stroke-width="1.2"/><line x1="145" y1="120" x2="190" y2="120" stroke-width="1.2"/><line x1="145" y1="135" x2="180" y2="135" stroke-width="1.2"/>
    <line x1="235" y1="90" x2="285" y2="90" stroke-width="1.2"/><line x1="235" y1="105" x2="275" y2="105" stroke-width="1.2"/><line x1="235" y1="120" x2="280" y2="120" stroke-width="1.2"/><line x1="235" y1="135" x2="270" y2="135" stroke-width="1.2"/>
    <!-- right: agents -->
    <rect x="360" y="40" width="300" height="200" rx="14" fill="#d0bfff" fill-opacity="0.2"/>
    <rect x="385" y="70" width="70" height="90" rx="6" stroke-dasharray="5 5"/>
    <rect x="475" y="70" width="70" height="90" rx="6" stroke-dasharray="5 5"/>
    <rect x="565" y="70" width="70" height="90" rx="6" stroke-dasharray="5 5"/>
    <path d="M510 200 C 510 185, 510 175, 510 165" marker-end="url(#tst-arr)"/>
  </g>
  <g fill="currentColor" font-size="13.3" text-anchor="middle">
    <text x="170" y="28">a team of engineers</text>
    <text x="510" y="28">agents + the harness</text>
    <text x="80" y="180" font-size="11.1">peer's code</text>
    <text x="170" y="180" font-size="11.1">peer's code</text>
    <text x="260" y="180" font-size="11.1">your code</text>
    <text x="170" y="215" font-size="11.8">you know how it works,</text>
    <text x="170" y="233" font-size="11.8">not every line</text>
    <text x="510" y="220" font-size="11.8">the harness holds the taste</text>
    <text x="510" y="270" font-size="11.8" fill="#8b5cf6">same deal: know how it works, let them teach you</text>
  </g>
</svg>
