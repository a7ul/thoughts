<svg xmlns="http://www.w3.org/2000/svg" text-rendering="geometricPrecision" viewBox="0 0 680 290" style="max-width:100%;display:block;margin:0 auto;color:var(--text)" font-family="Geist, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="rol-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="currentColor" stroke-width="1.5"/></marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <!-- before: specialist humans -->
    <circle cx="50" cy="80" r="16" fill="#ffd8a8" fill-opacity="0.5"/>
    <circle cx="50" cy="135" r="16" fill="#ffd8a8" fill-opacity="0.5"/>
    <circle cx="50" cy="190" r="16" fill="#ffd8a8" fill-opacity="0.5"/>
    <circle cx="50" cy="245" r="16" fill="#ffd8a8" fill-opacity="0.5"/>
    <path d="M250 160 C 290 160, 310 160, 345 160" marker-end="url(#rol-arr)"/>
    <!-- after: one generalist human -->
    <circle cx="420" cy="160" r="24" fill="#b2f2bb" fill-opacity="0.6"/>
    <line x1="446" y1="150" x2="560" y2="75"/>
    <line x1="446" y1="155" x2="560" y2="125"/>
    <line x1="446" y1="165" x2="560" y2="180"/>
    <line x1="446" y1="170" x2="560" y2="235"/>
    <rect x="565" y="60" width="100" height="32" rx="8" fill="#d0bfff" fill-opacity="0.35"/>
    <rect x="565" y="110" width="100" height="32" rx="8" fill="#d0bfff" fill-opacity="0.35"/>
    <rect x="565" y="165" width="100" height="32" rx="8" fill="#d0bfff" fill-opacity="0.35"/>
    <rect x="565" y="220" width="100" height="32" rx="8" fill="#d0bfff" fill-opacity="0.35"/>
  </g>
  <g fill="currentColor" font-size="13.3">
    <text x="20" y="40" font-size="12.6">specialist humans</text>
    <text x="80" y="86">PM</text>
    <text x="80" y="141">designer</text>
    <text x="80" y="196">frontend / backend dev</text>
    <text x="80" y="251">QA</text>
    <text x="420" y="40" text-anchor="middle" font-size="12.6">a generalist human</text>
    <text x="420" y="205" text-anchor="middle" font-size="11.8">holds the whole picture</text>
    <text x="420" y="223" text-anchor="middle" font-size="11.8">and makes the decisions</text>
    <text x="615" y="40" text-anchor="middle" font-size="12.6">specialist agents</text>
    <text x="615" y="81" text-anchor="middle" font-size="11.1">design</text>
    <text x="615" y="131" text-anchor="middle" font-size="11.1">code</text>
    <text x="615" y="186" text-anchor="middle" font-size="11.1">review</text>
    <text x="615" y="241" text-anchor="middle" font-size="11.1">maintenance</text>
  </g>
</svg>
