<svg xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" viewBox="0 0 680 320" style="max-width:100%;display:block;margin:0 auto;color:var(--text)" font-family="Caveat, 'Comic Sans MS', cursive">
  <defs>
    <filter id="rel-rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="29"/><feDisplacementMap in="SourceGraphic" scale="3"/><feGaussianBlur stdDeviation="0.4"/></filter>
    <marker id="rel-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="currentColor" stroke-width="1.5"/></marker>
  </defs>
  <g filter="url(#rel-rough)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <!-- before: relay race -->
    <rect x="20" y="45" width="100" height="50" rx="10" fill="#ffd8a8" fill-opacity="0.35"/>
    <path d="M122 70 C 140 70, 150 70, 168 70" marker-end="url(#rel-arr)"/>
    <rect x="172" y="45" width="100" height="50" rx="10" fill="#ffd8a8" fill-opacity="0.35"/>
    <path d="M274 70 C 292 70, 302 70, 320 70" marker-end="url(#rel-arr)"/>
    <rect x="324" y="45" width="100" height="50" rx="10" fill="#ffd8a8" fill-opacity="0.35"/>
    <path d="M426 70 C 444 70, 454 70, 472 70" marker-end="url(#rel-arr)"/>
    <rect x="476" y="45" width="100" height="50" rx="10" fill="#ffd8a8" fill-opacity="0.35"/>
    <path d="M578 70 C 600 70, 610 70, 628 70" marker-end="url(#rel-arr)"/>
    <line x1="20" y1="150" x2="660" y2="150" stroke-dasharray="4 8" stroke-width="1.2"/>
    <!-- after: one engineer, loops -->
    <rect x="40" y="195" width="170" height="60" rx="12" fill="#b2f2bb" fill-opacity="0.35"/>
    <path d="M212 225 C 260 225, 280 225, 318 225" marker-end="url(#rel-arr)"/>
    <rect x="322" y="195" width="120" height="60" rx="12" fill="#d0bfff" fill-opacity="0.35"/>
    <path d="M444 225 C 490 225, 510 225, 548 225" marker-end="url(#rel-arr)"/>
    <rect x="552" y="200" width="90" height="50" rx="10"/>
    <path d="M600 252 C 600 290, 125 290, 125 258" marker-end="url(#rel-arr)"/>
  </g>
  <g fill="currentColor" font-size="18" text-anchor="middle">
    <text x="20" y="28" text-anchor="start" font-size="17">before: the relay race</text>
    <text x="70" y="76">PM</text>
    <text x="222" y="76">designer</text>
    <text x="374" y="76">dev</text>
    <text x="526" y="76">QA</text>
    <text x="645" y="76" font-size="16">ship</text>
    <text x="340" y="125" font-size="16" fill="#e5484d">every arrow is a wait</text>
    <text x="20" y="180" text-anchor="start" font-size="17">now: one engineer, many tries</text>
    <text x="125" y="222">PM + designer</text>
    <text x="125" y="242">+ dev</text>
    <text x="382" y="230">agents</text>
    <text x="597" y="230">ship</text>
    <text x="360" y="310" font-size="16" fill="#30a46c">learn, fix, try again</text>
  </g>
</svg>
