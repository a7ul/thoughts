<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" style="max-width:100%;display:block;margin:0 auto;color:var(--text)" font-family="Caveat, 'Comic Sans MS', cursive">
  <defs>
    <filter id="mar-rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  </defs>
  <g filter="url(#mar-rough)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="95" x2="620" y2="95"/>
    <line x1="60" y1="87" x2="60" y2="103"/><line x1="620" y1="87" x2="620" y2="103"/>
    <line x1="60" y1="225" x2="620" y2="225"/>
    <line x1="60" y1="217" x2="60" y2="233"/><line x1="620" y1="217" x2="620" y2="233"/>
    <g stroke="#e5484d" stroke-width="2.5">
      <path d="M597 87 l12 12 M609 87 l-12 12"/>
      <path d="M149 217 l12 12 M161 217 l-12 12"/>
    </g>
    <g stroke="#30a46c" stroke-width="2.5">
      <circle cx="603" cy="70" r="7"/>
      <circle cx="519" cy="225" r="7"/>
    </g>
    <path d="M603 103 C 603 125, 603 125, 603 125"/>
    <path d="M155 250 C 155 268, 519 268, 519 250"/>
  </g>
  <g fill="currentColor" font-size="18">
    <text x="60" y="125" text-anchor="middle">0</text><text x="620" y="125" text-anchor="middle">1</text>
    <text x="60" y="255" text-anchor="middle">0</text><text x="620" y="255" text-anchor="middle">1</text>
    <text x="40" y="30" font-size="21">"the change reuses existing helpers"</text>
    <text x="40" y="52" font-size="17">0.97 before the fix, 0.97 after. margin ≈ 0 ✗</text>
    <text x="470" y="143" font-size="16" text-anchor="end">both land here. useless →</text>
    <text x="40" y="165" font-size="21">"no tool is added to a toolset when the agent</text>
    <text x="40" y="187" font-size="21"> already gets it from another toolset"</text>
    <text x="337" y="290" text-anchor="middle" font-size="18">0.17 before, 0.82 after. now it can tell them apart ✓</text>
  </g>
  <g font-size="16">
    <text x="660" y="28" fill="#e5484d" text-anchor="end">✗ the broken PR</text>
    <text x="660" y="46" fill="#30a46c" text-anchor="end">○ the fix</text>
  </g>
</svg>
