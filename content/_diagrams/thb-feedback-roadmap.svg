<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" style="max-width:100%;display:block;margin:0 auto;color:var(--text)" font-family="Caveat, 'Comic Sans MS', cursive">
  <defs>
    <filter id="fbr-rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="25"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <marker id="fbr-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="currentColor" stroke-width="1.5"/></marker>
    <marker id="fbr-arr-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#e5484d" stroke-width="1.5"/></marker>
    <marker id="fbr-arr-g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#30a46c" stroke-width="1.5"/></marker>
  </defs>
  <g filter="url(#fbr-rough)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <!-- feedback pile -->
    <rect x="20" y="40" width="130" height="34" rx="6" fill="#ffd8a8" fill-opacity="0.35"/>
    <rect x="30" y="84" width="130" height="34" rx="6" fill="#ffd8a8" fill-opacity="0.35"/>
    <rect x="20" y="128" width="130" height="34" rx="6" fill="#ffd8a8" fill-opacity="0.35"/>
    <rect x="30" y="172" width="130" height="34" rx="6" fill="#ffd8a8" fill-opacity="0.35"/>
    <!-- path 1: build requests one by one -->
    <path d="M165 70 C 260 40, 330 40, 420 55" marker-end="url(#fbr-arr-r)" stroke="#e5484d"/>
    <rect x="425" y="22" width="235" height="86" rx="10"/>
    <!-- path 2: look at the problem underneath -->
    <path d="M165 175 C 210 185, 230 190, 258 190" marker-end="url(#fbr-arr)"/>
    <rect x="262" y="160" width="140" height="62" rx="10" fill="#d0bfff" fill-opacity="0.35"/>
    <path d="M404 190 C 420 190, 425 190, 438 190" marker-end="url(#fbr-arr-g)" stroke="#30a46c"/>
    <rect x="442" y="155" width="218" height="72" rx="10" fill="#b2f2bb" fill-opacity="0.35"/>
  </g>
  <g fill="currentColor" font-size="16" text-anchor="middle">
    <text x="85" y="22" font-size="17">product feedback</text>
    <text x="85" y="62">support tickets</text>
    <text x="95" y="106">feature requests</text>
    <text x="85" y="150">errors</text>
    <text x="95" y="194">analytics</text>
    <text x="290" y="34" font-size="16" fill="#e5484d">build each request as asked</text>
    <text x="542" y="55" font-size="18">the sum of everyone's guesses</text>
    <text x="542" y="77" font-size="15">a bit better at everything,</text>
    <text x="542" y="92" font-size="15">different at nothing</text>
    <text x="332" y="186" font-size="17">the problem</text>
    <text x="332" y="206" font-size="17">underneath</text>
    <text x="551" y="186" font-size="18">the roadmap</text>
    <text x="551" y="208" font-size="15">the answer nobody asked for</text>
    <text x="340" y="262" font-size="18">product feedback != product roadmap</text>
  </g>
</svg>
