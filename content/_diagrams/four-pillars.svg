<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" style="max-width:100%;display:block;margin:0 auto">
  <rect x="10" y="10" width="210" height="80" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="115" y="42" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#5b21b6">1. Delegate</text>
  <text x="115" y="62" text-anchor="middle" font-size="11" font-family="Georgia, serif" fill="#5b21b6">hand off a task that persists</text>
  <rect x="240" y="10" width="210" height="80" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="345" y="42" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#1d4ed8">2. Teach</text>
  <text x="345" y="62" text-anchor="middle" font-size="11" font-family="Georgia, serif" fill="#1d4ed8">capture your rules and quirks</text>
  <rect x="10" y="110" width="210" height="80" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="115" y="142" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#92400e">3. Monitor</text>
  <text x="115" y="162" text-anchor="middle" font-size="11" font-family="Georgia, serif" fill="#92400e">see what ran in your absence</text>
  <rect x="240" y="110" width="210" height="80" rx="8" fill="#b2f2bb" stroke="#37b24d" stroke-width="1.5"/>
  <text x="345" y="142" text-anchor="middle" font-size="14" font-family="Georgia, serif" fill="#2b8a3e">4. Stay in control</text>
  <text x="345" y="162" text-anchor="middle" font-size="11" font-family="Georgia, serif" fill="#2b8a3e">step in when judgement is needed</text>
</svg>
